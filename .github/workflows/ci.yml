name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AUTH_PROVIDER: keycloak
      # Placeholder: `next build` only needs the variable to exist; nothing contacts Keycloak.
      KEYCLOAK_CLIENT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `turbo --affected` filters correctly
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test --affected
      # Separate step: `next build` and `tsc` both rewrite apps/*/.next/types, so running them together flakes.
      - run: pnpm turbo run build --affected
